<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quản Lý Giờ Gà</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; }
        body { background: #f8fafc; color: #1e293b; padding: 8px; }
        .container { max-width: 680px; margin: auto; display: flex; flex-direction: column; gap: 8px; }
        .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 10px; }
        .header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 15px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: #d97706; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0; }
        label { font-size: 12px; font-weight: 600; color: #475569; display: block; margin-bottom: 2px; }
        input, textarea { width: 100%; padding: 7px 9px; border: 1px solid #cbd5e1; border-radius: 5px; outline: none; }
        textarea { font-family: monospace; resize: vertical; min-height: 55px; line-height: 1.35; }
        .main-txt { min-height: 260px; }
        .btn-group { display: flex; gap: 5px; margin-top: 6px; }
        button { flex: 1; padding: 8px 4px; border: none; border-radius: 5px; font-weight: 600; cursor: pointer; color: #fff; font-size: 12.5px; }
        button:active { opacity: 0.8; }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        .b-blue { background: #0284c7; } .b-green { background: #16a34a; } .b-red { background: #dc2626; } 
        .b-slate { background: #475569; } .b-dark { background: #1e293b; } .b-warn { background: #d97706; }
        #baseLot { font-weight: bold; text-align: center; background: #f1f5f9; color: #0284c7; }
        .lock-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-radius: 5px; font-size: 12.5px; font-weight: 600; }
        .s-edit { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .s-view { background: #ffedd5; color: #9a3412; border: 1px solid #fed7aa; }
        .speed-bar { display: flex; justify-content: space-between; align-items: center; background: #f0f9ff; color: #0369a1; padding: 6px 10px; border-radius: 5px; font-weight: 600; font-size: 12px; border: 1px solid #bae6fd; }
        .btn-claim { background: #ea580c; color: #fff; padding: 3px 8px; border-radius: 4px; border: none; font-size: 11.5px; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <div class="card header">
        <div><span id="syncDot" class="dot"></span> HỆ THỐNG GIỜ GÀ</div>
        <button id="lockBtn" class="b-slate edit-btn" style="flex:unset; padding: 4px 10px;" onclick="handleAuthClick()">🔒 Mở khóa Cài đặt</button>
    </div>

    <div id="lockStatusBar" class="lock-bar s-view">
        <span id="lockStatusText">⏳ Đang đồng bộ dữ liệu đám mây...</span>
        <button id="claimBtn" class="btn-claim" style="display:none;" onclick="forceClaimLock()">⚡ Chiếm quyền sửa</button>
    </div>

    <div class="speed-bar">
        <span>⚡ Tốc độ chuyền: <strong id="speedBadge">120 con/p</strong></span>
        <span>⏱️ Vòng 2 cách: <strong id="intervalBadge">135p (2h15)</strong></span>
    </div>

    <div id="secureArea" style="display: flex; flex-direction: column; gap: 8px;"></div>

    <div class="card">
        <label>🕒 BẢNG GIỜ CHI TIẾT</label>
        <textarea id="ioArea" class="main-txt" placeholder="Đang tải dữ liệu..."></textarea>
        <div class="btn-group">
            <button class="b-slate edit-btn" onclick="pasteVal('ioArea')">📋 Dán</button>
            <button class="b-dark" onclick="copySchedule()">📄 Copy</button>
            <button class="b-warn edit-btn" onclick="undo()">↩️ Hoàn tác</button>
            <button class="b-red edit-btn" onclick="clearAll()">🗑️ Xóa</button>
        </div>
    </div>

    <div class="card">
        <label style="color: #0284c7;">⚡ XỬ LÝ TIN NHẮN ZALO</label>
        <textarea id="zaloInput" placeholder="Ví dụ: Hết xe 26&#10;Treo xe 27 line 2, BS 793: 17:58"></textarea>
        <div class="btn-group">
            <button class="b-slate edit-btn" onclick="pasteVal('zaloInput')">📋 Dán</button>
            <button class="b-blue edit-btn" onclick="parseZalo()">⚡ Phân tích & Ghi nhận</button>
        </div>
    </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxp9hlyLO5fzsIc_mwRcqk1Z9AIZkuybxoVGuYJV1v9rQT9taLNQ9_UCgA1CTi5yxXN/exec";
const TELE_BOT_TOKEN = "8778714722:AAHixOGsUdxzqUCznUF1vmM78OmI6EZfOEU";
const TELE_ADMIN_ID = "812350114";

const $ = id => document.getElementById(id);
const MY_SESSION_ID = 'U_' + Math.random().toString(36).substring(2, 9);

let lockState = { holder: '', lastActive: 0 }, isViewerOnly = true, isInitialized = false, userHasModified = false, myLastActionTime = 0;
let isUnlocked = false, history = [], saveTimer;
let currentOTP = null, otpExpires = 0;

const H = { zaloNote: '', zaloIncident: '', incInput: '', configLine1: '1, 10, 16, 21', configLine2: '22, 32, 34, 45', lineSpeed: '120', reportDate: '', baseLot: '' };

const getVal = k => isUnlocked && $(k) ? $(k).value : (H[k] || '');
const setVal = (k, v) => { H[k] = v; if (isUnlocked && $(k)) $(k).value = v; };

// Xử lý thời gian & Chuẩn hóa
const parseTime = s => { const m = (s || '').match(/\b(2[0-3]|[01]?[0-9])\s*[:hgp\.]\s*([0-5][0-9])\b/i); return m ? `${+m[1]}h${m[2]}` : null; };
const toMins = t => { const p = parseTime(t); if (!p) return null; const [h, m] = p.split('h').map(Number); return (h < 5 ? h + 24 : h) * 60 + m; };
const toTimeStr = m => m === null ? '' : `${Math.floor(((m + 14400) % 1440) / 60)}h${String(m % 60).padStart(2, '0')}`;

// Nội suy tốc độ chuyền ra thời gian chờ giữa 2 vòng (120 -> 135p, 125 -> 130p)
const speedToOffset = spd => Math.round(16200 / (+spd || 120));
const getRoundOffset = () => speedToOffset(getVal('lineSpeed') || 120);
const getSpeedTimeDesc = spd => {
    const mins = speedToOffset(spd);
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return `${mins}p (${h}h${m > 0 ? String(m).padStart(2, '0') : '00'})`;
};
function updateSpeedDisplay() {
    const spd = getVal('lineSpeed') || 120;
    const desc = getSpeedTimeDesc(spd);
    if ($('speedTimePreview')) $('speedTimePreview').value = desc;
    if ($('speedBadge')) $('speedBadge').innerText = `${spd} con/p`;
    if ($('intervalBadge')) $('intervalBadge').innerText = desc;
}

// Xóa nhiễu Biển số, Line, Số xe
const cleanZaloStr = s => (s || '').replace(/\b(?:bs|biển\s*số|bks|biển)\s*[:\.]?\s*[a-z0-9:\.-]+/gi, ' ').replace(/\b(?:line\s*\d+|l\s*\d+)\s*[:\.]?/gi, ' ');
const cleanForTime = s => cleanZaloStr(s).replace(/\b(?:xe|x)\s*\d+\s*[:\.]?/gi, ' ');

function syncDate(auto = true) {
    const d = auto ? new Date(Date.now() - 18e6) : new Date(getVal('reportDate').replace(/-/g, '/'));
    if (auto) setVal('reportDate', d.toISOString().slice(0, 10));
    setVal('baseLot', 235 + Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(2026, 7, 23)) / 864e5));
}
const getHeader = () => `🐓 GÀ ${getVal('reportDate').split('-').reverse().slice(0, 2).join('.')} - LOT ${getVal('baseLot')} 🐓`;

// Quản lý khóa phiên
function refreshMyLock() {
    userHasModified = true; myLastActionTime = lockState.lastActive = Date.now();
    lockState.holder = MY_SESSION_ID; isViewerOnly = false; renderLockStatus();
}
function renderLockStatus() {
    isViewerOnly = !!(lockState.holder && lockState.holder !== MY_SESSION_ID && (Date.now() - lockState.lastActive < 35000));
    const isLocked = !isInitialized || isViewerOnly;
    $('lockStatusBar').className = `lock-bar ${isLocked ? 's-view' : 's-edit'}`;
    $('lockStatusText').innerText = !isInitialized ? '⏳ Đang đồng bộ dữ liệu...' : (isViewerOnly ? `🔒 Đang có người khác nhập liệu (Tự mở sau ${Math.max(1, Math.ceil((35000 - (Date.now() - lockState.lastActive)) / 1000))}s nếu họ dừng)` : '🟢 Bạn đang giữ quyền chỉnh sửa');
    $('claimBtn').style.display = (isInitialized && isViewerOnly) ? 'inline-block' : 'none';
    $('ioArea').readOnly = $('zaloInput').readOnly = isLocked;
    document.querySelectorAll('.edit-btn').forEach(btn => btn.disabled = isLocked);
}
function forceClaimLock() { refreshMyLock(); pushSave(); alert("⚡ Bạn đã nhận quyền chỉnh sửa thành công!"); }

// Gửi OTP xác thực về Telegram
async function sendTelegramOTP(otp) {
    const text = `🔔 *HỆ THỐNG GIỜ GÀ*\n🔑 Mã OTP mở khóa Cài đặt: *${otp}*\n⏱️ Mã có hiệu lực trong vòng 3 phút.`;
    const url = `https://api.telegram.org/bot${TELE_BOT_TOKEN}/sendMessage?chat_id=${TELE_ADMIN_ID}&text=${encodeURIComponent(text)}&parse_mode=Markdown`;
    try {
        const res = await fetch(url);
        const data = await res.json();
        return data && data.ok;
    } catch (e) {
        return false;
    }
}

async function handleAuthClick() {
    if (isViewerOnly) return alert("Bạn đang ở chế độ xem, không thể mở Cài đặt!");
    if (isUnlocked) return lockSettings();

    currentOTP = Math.floor(100000 + Math.random() * 900000).toString();
    otpExpires = Date.now() + 180000;

    const btn = $('lockBtn');
    const oldText = btn.innerText;
    btn.innerText = "⏳ Đang gửi OTP...";
    btn.disabled = true;

    const sent = await sendTelegramOTP(currentOTP);
    btn.innerText = oldText;
    btn.disabled = false;

    if (!sent) {
        return alert("❌ Lỗi gửi mã về Telegram! Hãy kiểm tra kết nối mạng hoặc đảm bảo bạn đã bấm /start với bot.");
    }

    const code = prompt("📲 Mã xác thực 6 số đã được gửi tới Telegram của bạn. Vui lòng nhập mã:");
    if (!code) return;

    if (Date.now() > otpExpires) {
        currentOTP = null;
        return alert("⛔ Mã xác thực đã hết hạn! Vui lòng bấm mở khóa lại.");
    }

    if (code.trim() === currentOTP) {
        currentOTP = null;
        unlockSettings();
    } else {
        alert("❌ Mã xác thực không chính xác!");
    }
}

function unlockSettings() {
    isUnlocked = true; $('lockBtn').innerText = "🔓 Khóa Cài đặt"; $('lockBtn').className = "b-warn";
    $('secureArea').innerHTML = `
        <div class="card" style="border-color:#16a34a;">
            <div class="grid-2">
                <div><label>Ngày:</label><input type="date" id="reportDate" value="${H.reportDate}" onchange="refreshMyLock(); syncDate(false); autoRounds(true); pushSave();"></div>
                <div><label>Lot:</label><input type="number" id="baseLot" value="${H.baseLot}" readonly></div>
            </div>
            <div class="grid-2">
                <div>
                    <label>Tốc độ Line (con/phút):</label>
                    <input type="number" id="lineSpeed" value="${H.lineSpeed || 120}" oninput="refreshMyLock(); updateSpeedDisplay(); autoRounds(true); pushSave();" placeholder="120">
                </div>
                <div>
                    <label>Thời gian vòng 2:</label>
                    <input type="text" id="speedTimePreview" value="${getSpeedTimeDesc(H.lineSpeed || 120)}" readonly style="background:#f1f5f9; font-weight:bold; color:#0284c7;">
                </div>
            </div>
            <div class="grid-2">
                <div><label>Line 1:</label><input type="text" id="configLine1" value="${H.configLine1}" oninput="refreshMyLock(); pushSave()"></div>
                <div><label>Line 2:</label><input type="text" id="configLine2" value="${H.configLine2}" oninput="refreshMyLock(); pushSave()"></div>
            </div>
            <div class="btn-group">
                <button class="b-green edit-btn" onclick="genTemplate()">TẠO BẢNG MẪU MỚI</button>
            </div>
        </div>
        <div class="card" style="border-color:#dc2626;">
            <label style="color:#dc2626;">⚠️ SỰ CỐ DỪNG CHUYỀN</label>
            <textarea id="incInput" placeholder="Ví dụ: Line 1 dừng 19h29 Line 1 chạy 19h39&#10;Hoặc: Line 1 dừng 19h29-19h39">${H.incInput}</textarea>
            <div class="btn-group">
                <button class="b-slate edit-btn" onclick="pasteVal('incInput')">📋 Dán</button>
                <button class="b-red edit-btn" onclick="applyIncident()">⏱️ Dời giờ</button>
            </div>
        </div>
        <div class="card">
            <label>📌 Nhật ký Zalo:</label><textarea id="zaloNote" style="margin-bottom:6px;" oninput="refreshMyLock(); pushSave()">${H.zaloNote}</textarea>
            <label style="color:#dc2626;">⚠️ Lịch sử sự cố:</label><textarea id="zaloIncident" oninput="refreshMyLock(); pushSave()">${H.zaloIncident}</textarea>
        </div>`;
    snapshot(); renderLockStatus(); updateSpeedDisplay();
}

function lockSettings() {
    if (isUnlocked) ['zaloNote', 'zaloIncident', 'incInput', 'configLine1', 'configLine2', 'lineSpeed', 'reportDate', 'baseLot'].forEach(k => { if ($(k)) H[k] = $(k).value; });
    isUnlocked = false; $('secureArea').innerHTML = ''; $('lockBtn').innerText = "🔒 Mở khóa Cài đặt"; $('lockBtn').className = "b-slate";
    updateSpeedDisplay();
}

// Chuyển đổi dòng & Vòng 2
function transformRows(fn) {
    let line = 1;
    $('ioArea').value = $('ioArea').value.split('\n').map(r => {
        if (r.includes('LINE 1')) line = 1; if (r.includes('LINE 2')) line = 2;
        const m = r.match(/^(Xe(\d+):\s*)(.*)$/i);
        return m ? fn(m[1], +m[2], m[3].trim(), line, r) : r;
    }).join('\n');
}

function autoRounds(forceRecalc = false) {
    const offset = getRoundOffset();
    transformRows((pfx, car, body) => {
        let [r1 = '', r2 = ''] = body.split(' - ').map(s => s.trim());
        if (r1.includes('-')) {
            const [s, e] = r1.split('-').map(toMins);
            if (s !== null && e !== null && (forceRecalc || !r2.includes('-'))) {
                r2 = `${toTimeStr(s + offset)}-${toTimeStr(s + offset + e - s)}`;
            }
        }
        return `${pfx}${r1}${r2 ? ' - ' + r2 : ''}`;
    });
    $('ioArea').value = `${getHeader()}\n\n${$('ioArea').value.split('\n').filter(l => !l.includes('🐓')).join('\n').trim()}\n`;
}

// Bóc tách sự cố thông minh qua text
function parseIncident(raw) {
    if (!raw) return null;
    let targetLine = 1;
    if (/\b(?:line\s*2|l2|chuy[ềe]n\s*2)\b/i.test(raw)) targetLine = 2;
    else if (/\b(?:line\s*1|l1|chuy[ềe]n\s*1)\b/i.test(raw)) targetLine = 1;

    let sM = null, eM = null;
    const dungMatch = raw.match(/(?:dừng|dung|stop|nghỉ|nghi)[^\d:]*([0-2]?[0-9]\s*[:hgp\.]\s*[0-5][0-9])/i);
    const chayMatch = raw.match(/(?:chạy|chay|run|start|hoạt động|hoat dong)[^\d:]*([0-2]?[0-9]\s*[:hgp\.]\s*[0-5][0-9])/i);

    if (dungMatch && chayMatch) {
        sM = toMins(parseTime(dungMatch[1]));
        eM = toMins(parseTime(chayMatch[1]));
    }
    if (sM === null || eM === null) {
        const rangeMatch = raw.match(/([0-2]?[0-9]\s*[:hgp\.]\s*[0-5][0-9])\s*(?:-|\bđến\b|\bden\b|\btới\b|\btoi\b)\s*([0-2]?[0-9]\s*[:hgp\.]\s*[0-5][0-9])/i);
        if (rangeMatch) {
            sM = toMins(parseTime(rangeMatch[1]));
            eM = toMins(parseTime(rangeMatch[2]));
        }
    }
    if (sM === null || eM === null) {
        const allTimes = (cleanForTime(raw).match(/\b(2[0-3]|[01]?[0-9])\s*[:hgp\.]\s*([0-5][0-9])\b/gi) || []).map(parseTime);
        if (allTimes.length >= 2) {
            sM = toMins(allTimes[0]);
            eM = toMins(allTimes[1]);
        }
    }
    if (sM === null || eM === null) return null;
    if (eM < sM) eM += 1440;
    const shift = eM - sM;
    if (shift <= 0) return null;
    return { targetLine, sM, eM, shift };
}

// Xử lý sự cố dời giờ (bảo vệ mốc giờ Vòng 1 khi sự cố ở Vòng 2)
function applyIncident() {
    if (isViewerOnly) return alert("Bạn không có quyền sửa!");
    const raw = getVal('incInput').trim();
    const inc = parseIncident(raw);
    if (!inc) return alert("Cú pháp ví dụ:\nLine 1 dừng 19h29 Line 1 chạy 19h39\nhoặc: Line 1 dừng 19h29-19h39");
    
    const { targetLine, sM, eM, shift } = inc;
    const offset = getRoundOffset();

    refreshMyLock(); snapshot();

    transformRows((pfx, car, body, line) => {
        if (line !== targetLine) return `${pfx}${body}`;
        let [r1 = '', r2 = ''] = body.split(' - ').map(s => s.trim());
        const hasR1 = r1.includes('-');
        const hasR2 = r2.includes('-');

        // Trường hợp sự cố diễn ra tại Vòng 1: Dời V1 và tịnh tiến V2 tương ứng
        if (hasR1) {
            const [s1, e1] = r1.split('-').map(toMins);
            if (s1 !== null && e1 !== null) {
                if (s1 >= sM || (sM >= s1 && sM <= e1)) {
                    const newS1 = (s1 >= sM) ? s1 + shift : s1;
                    const newE1 = e1 + shift;
                    r1 = `${toTimeStr(newS1)}-${toTimeStr(newE1)}`;
                    
                    const newS2 = newS1 + offset;
                    const newE2 = newS2 + (newE1 - newS1);
                    r2 = `${toTimeStr(newS2)}-${toTimeStr(newE2)}`;
                    return `${pfx}${r1} - ${r2}`;
                }
            }
        }

        // Trường hợp sự cố diễn ra tại Vòng 2: Giữ nguyên tuyệt đối Vòng 1, chỉ tịnh tiến Vòng 2
        if (hasR2) {
            const [s2, e2] = r2.split('-').map(toMins);
            if (s2 !== null && e2 !== null) {
                if (s2 >= sM || (sM >= s2 && sM <= e2)) {
                    const newS2 = (s2 >= sM) ? s2 + shift : s2;
                    const newE2 = e2 + shift;
                    r2 = `${toTimeStr(newS2)}-${toTimeStr(newE2)}`;
                    return `${pfx}${r1} - ${r2}`;
                }
            }
        }

        return `${pfx}${r1}${r2 ? ' - ' + r2 : ''}`;
    });

    setVal('zaloIncident', (getVal('zaloIncident') ? getVal('zaloIncident') + '\n' : '') + `${raw} (+${shift}p)`);
    setVal('incInput', '');
    pushSave();
    alert(`✅ Đã dời Line ${targetLine} thêm ${shift} phút (Dừng từ ${toTimeStr(sM)} đến ${toTimeStr(eM)})!`);
}

// Bóc tách tin Zalo
function parseZalo() {
    if (isViewerOnly) return alert("Đang có người khác nhập liệu, bạn không thể sửa!");
    const raw = $('zaloInput').value.trim();
    if (!raw || !$('ioArea').value.trim()) return alert("Thiếu dữ liệu Time hoặc tin nhắn!");
    refreshMyLock(); snapshot();

    const clauses = raw.split(/[\n;,]+/).map(s => s.trim()).filter(Boolean);
    const allTimes = (cleanForTime(raw).match(/\b(2[0-3]|[01]?[0-9])\s*[:hgp\.]\s*([0-5][0-9])\b/gi) || []).map(parseTime);
    let ctxLine = /\b(l2|line\s*2)\b/i.test(raw) ? 2 : (/\b(l1|line\s*1)\b/i.test(raw) ? 1 : null);
    const actions = [];

    clauses.forEach((cl, i) => {
        if (/\b(l2|line\s*2)\b/i.test(cl)) ctxLine = 2;
        else if (/\b(l1|line\s*1)\b/i.test(cl)) ctxLine = 1;

        const clean = cleanZaloStr(cl);
        const forTime = cleanForTime(cl);
        let times = (forTime.match(/\b(2[0-3]|[01]?[0-9])\s*[:hgp\.]\s*([0-5][0-9])\b/gi) || []).map(parseTime);
        if (!times.length) {
            const near = clauses.slice(i + 1).concat(clauses.slice(0, i)).find(s => parseTime(cleanForTime(s)));
            times = near ? (cleanForTime(near).match(/\b(2[0-3]|[01]?[0-9])\s*[:hgp\.]\s*([0-5][0-9])\b/gi) || []).map(parseTime) : allTimes;
        }
        if (!times.length) return;

        const ext = (reg, type) => [...clean.matchAll(reg)].forEach(m => actions.push({ car: +m[1], type, times, line: ctxLine }));
        ext(/(?:hết|het|xong|stop)\s+(?:xe|x)\s*(\d+)/gi, 'HET'); 
        ext(/(?:xe|x)\s*(\d+)\s*(?:hết|het|xong|stop)/gi, 'HET');
        ext(/(?:treo|start|bắt đầu)\s+(?:xe|x)\s*(\d+)/gi, 'TREO'); 
        ext(/(?:xe|x)\s*(\d+)\s*(?:treo|start|bắt đầu)/gi, 'TREO');
        ext(/(?:xe|x)\s*(\d+)(?!\s*(?:hết|treo|start|stop))/gi, 'AUTO');
    });

    transformRows((pfx, car, body, lNum) => {
        const act = actions.find(a => a.car === car && (!a.line || a.line === lNum));
        if (!act) return `${pfx}${body}`;
        let [r1 = '', r2 = ''] = body.split(' - ').map(s => s.trim()), [s = '', e = ''] = r1.includes('-') ? r1.split('-') : [r1, ''];
        if (act.type === 'HET') e = act.times[0]; 
        else if (act.type === 'TREO') s = act.times[0];
        else if (act.times.length >= 2) [s, e] = act.times; 
        else if (!s) s = act.times[0]; 
        else e = act.times[0];
        return `${pfx}${s}-${e}${r2 ? ' - ' + r2 : ''}`;
    });

    autoRounds(); 
    setVal('zaloNote', (getVal('zaloNote') ? getVal('zaloNote') + '\n' : '') + raw);
    $('zaloInput').value = ''; 
    pushSave();
}

// Sinh mẫu Line
function genTemplate() {
    if (isViewerOnly) return alert("Bạn không có quyền sửa!");
    refreshMyLock(); snapshot();
    const parseL = (cfg, def) => {
        const arr = cfg.split(',').map(s => s.trim()).filter(Boolean);
        return arr.slice(0, -1).map((val, i) => ({
            name: val.includes(':') ? val.split(':')[0].trim() : `${def + i}`,
            cars: Array.from({ length: (+(arr[i + 1].split(':')[1] || arr[i + 1]) - +(val.split(':')[1] || val)) }, (_, k) => +(val.split(':')[1] || val) + k)
        }));
    };
    const render = (name, lots) => lots.length ? `${name}\n` + lots.map(l => `\n • Sublot ${l.name}\n` + l.cars.map(c => `Xe${c}:`).join('\n')).join('\n') + '\n\n' : '';
    $('ioArea').value = `${getHeader()}\n\n${render('LINE 1', parseL(getVal('configLine1'), 11))}${render('LINE 2', parseL(getVal('configLine2'), 21))}`.trim() + '\n';
    pushSave();
}

// Quản lý trạng thái Undo & Lưu trữ
function snapshot() {
    const s = { ioArea: $('ioArea').value, zaloInput: $('zaloInput').value, ...H };
    if (isUnlocked) ['zaloNote', 'zaloIncident', 'incInput', 'configLine1', 'configLine2', 'lineSpeed'].forEach(k => { if ($(k)) s[k] = $(k).value; });
    if (JSON.stringify(history.at(-1)) !== JSON.stringify(s)) { history.push(s); if (history.length > 25) history.shift(); }
}
function undo() {
    if (isViewerOnly || history.length <= 1) return alert(isViewerOnly ? "Không có quyền sửa!" : "Không còn lịch sử hoàn tác!");
    refreshMyLock(); history.pop(); const p = history.at(-1);
    $('ioArea').value = p.ioArea || ''; $('zaloInput').value = p.zaloInput || '';
    Object.keys(H).forEach(k => setVal(k, p[k] || '')); updateSpeedDisplay(); pushSave();
}
function pushSave() {
    if (!isInitialized) return;
    clearTimeout(saveTimer); $('syncDot').style.background = '#d97706';
    if (isUnlocked) ['zaloNote', 'zaloIncident', 'incInput', 'configLine1', 'configLine2', 'lineSpeed'].forEach(k => { if ($(k)) H[k] = $(k).value; });
    localStorage.setItem('c_ioArea', $('ioArea').value);
    Object.keys(H).forEach(k => localStorage.setItem('c_' + k, H[k]));
    saveTimer = setTimeout(() => {
        if (!API_URL) return;
        fetch(API_URL, {
            method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
                date: getVal('reportDate'), baseLot: getVal('baseLot'), ioArea: $('ioArea').value,
                zaloNote: getVal('zaloNote'), zaloIncident: getVal('zaloIncident'), incidentInput: getVal('incInput'),
                configL1: getVal('configLine1'), configL2: getVal('configLine2'), lineSpeed: getVal('lineSpeed'),
                lockHolder: lockState.holder, lockActive: lockState.lastActive
            })
        }).then(() => $('syncDot').style.background = '#16a34a').catch(() => $('syncDot').style.background = '#dc2626');
    }, 600);
}

async function pasteVal(id) { 
    if (isViewerOnly) return alert("Bạn không có quyền sửa!");
    refreshMyLock(); snapshot(); 
    try { const t = await navigator.clipboard.readText(); if ($(id)) $(id).value = t; else setVal(id, t); pushSave(); } catch {} 
}
async function copySchedule() { autoRounds(); await navigator.clipboard.writeText($('ioArea').value); alert("✅ Đã chép lịch!"); }
function clearAll() { 
    if (isViewerOnly) return alert("Bạn không có quyền sửa!");
    if (confirm("Xóa sạch toàn bộ bảng?")) { refreshMyLock(); snapshot(); $('ioArea').value = $('zaloInput').value = ''; Object.keys(H).forEach(k => setVal(k, '')); pushSave(); } 
}

// Đồng bộ Cloud Realtime
function fetchRemoteData() {
    if (!API_URL) return;
    fetch(API_URL).then(r => r.json()).then(d => {
        if (d.lockHolder !== undefined && d.lockActive !== undefined) {
            lockState.holder = d.lockHolder; lockState.lastActive = +d.lockActive;
        }
        if (!isInitialized) {
            if (d.ioArea !== undefined && d.ioArea !== '') { $('ioArea').value = d.ioArea; localStorage.setItem('c_ioArea', d.ioArea); }
            const map = { incidentInput: 'incInput', configL1: 'configLine1', configL2: 'configLine2', lineSpeed: 'lineSpeed', date: 'reportDate', baseLot: 'baseLot', zaloNote: 'zaloNote', zaloIncident: 'zaloIncident' };
            Object.keys(map).forEach(k => { if (d[k] !== undefined) setVal(map[k], d[k]); });
            isInitialized = true; snapshot();
        } else if (isViewerOnly) {
            if (d.ioArea !== undefined && d.ioArea !== $('ioArea').value) $('ioArea').value = d.ioArea;
            ['zaloNote', 'zaloIncident', 'incidentInput', 'lineSpeed'].forEach(k => {
                const mapK = k === 'incidentInput' ? 'incInput' : k;
                if (d[k] !== undefined) setVal(mapK, d[k]);
            });
        }
        updateSpeedDisplay(); renderLockStatus(); $('syncDot').style.background = '#16a34a';
    }).catch(() => { if (!isInitialized) { isInitialized = true; renderLockStatus(); } $('syncDot').style.background = '#dc2626'; });
}

// Khởi chạy hệ thống
window.onload = () => {
    syncDate(true);
    const cachedIO = localStorage.getItem('c_ioArea');
    if (cachedIO) $('ioArea').value = cachedIO;
    Object.keys(H).forEach(k => { const c = localStorage.getItem('c_' + k); if (c) H[k] = c; });

    $('ioArea').oninput = () => { refreshMyLock(); pushSave(); };
    $('zaloInput').oninput = () => { refreshMyLock(); };
    updateSpeedDisplay();
    fetchRemoteData();
};

setInterval(() => {
    if (isInitialized && !isViewerOnly && userHasModified && (Date.now() - myLastActionTime < 30000)) {
        lockState.lastActive = Date.now(); pushSave();
    }
    fetchRemoteData();
}, 6000);

setInterval(() => { 
    if (!isViewerOnly && isInitialized) {
        const old = getVal('reportDate'); syncDate(true);
        if (old !== getVal('reportDate') && $('ioArea').value.includes('🐓')) { autoRounds(); pushSave(); }
    }
}, 30000);
</script>
